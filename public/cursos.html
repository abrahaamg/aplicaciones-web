<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <title>Cursos | Centro de Formación</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <a class="visually-hidden-focusable" href="#contenido">Saltar al contenido</a>

    <div id="navbar"></div>

    <main id="contenido" class="container my-4 flex-grow-1">
        <nav aria-label="Ruta de navegación">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
                <li class="breadcrumb-item active" aria-current="page">Cursos</li>
            </ol>
        </nav>

        <h1>Cursos</h1>
        <p>Oferta formativa del centro.</p>

        <div class="mb-4 col-md-6">
            <label for="buscar-curso" class="form-label">Buscar curso</label>
            <input type="search" id="buscar-curso" class="form-control" placeholder="Nombre o descripción">
        </div>

        <div id="lista-cursos" class="row g-4"></div>

        <!-- Confirmación antes de borrar un curso -->
        <div class="modal fade" id="modal-borrar" tabindex="-1" aria-labelledby="titulo-modal-borrar" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="titulo-modal-borrar">Borrar curso</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <p>¿Seguro que quieres borrar el curso <strong id="nombre-curso-borrar"></strong>? No se puede deshacer.</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger" id="confirmar-borrar">Borrar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/components.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/cursos.js"></script>
</body>
</html>
