<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="img/favicon.ico">
    <title>Iniciar sesión | Centro de Formación</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar"></div>

    <main id="contenido" class="container my-4 flex-grow-1">
        <nav aria-label="Ruta de navegación">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
                <li class="breadcrumb-item active" aria-current="page">Iniciar sesión</li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <h1 class="text-center">Iniciar sesión</h1>

                <form id="formulario-login" class="mt-4" novalidate>
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="correo" autocomplete="username" required>
                        <div class="invalid-feedback">Introduce un correo válido.</div>
                    </div>

                    <div class="mb-3">
                        <label for="clave" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="clave" autocomplete="current-password" required>
                        <div class="invalid-feedback">Introduce la contraseña.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/components.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
